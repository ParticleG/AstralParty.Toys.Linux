name: Upstream release

# Points aur/PKGBUILD at each new upstream AstralParty.Toys release on a branch, builds and tests
# the package there, then opens a pull request; a failure opens an issue instead. Merging the pull
# request publishes the package (aur.yml). Nothing is merged into main automatically.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-release

env:
  UPSTREAM: higashitaniyume/AstralParty.Toys

jobs:
  update:
    name: Update the PKGBUILD
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      branch: ${{ steps.release.outputs.branch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Find the latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          version=${tag#v}
          current=$(sed -n 's/^pkgver=//p' aur/PKGBUILD)
          branch="update/astralparty-toys-$version"
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)" = "$current" ]; then
            echo "The PKGBUILD already packages $current."
          elif git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Update and push
        if: steps.release.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          asset="AstralParty.Toys-$TAG-win-x64-self-contained-portable.zip"
          digest=$(gh release view "$TAG" --repo "$UPSTREAM" --json assets --jq ".assets[] | select(.name == \"$asset\") | .digest")
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::$TAG has no $asset with a SHA-256 digest."; exit 1 ;;
          esac
          # The toolbox archive is the first source.
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e 's/^pkgrel=.*/pkgrel=1/' \
            -e "s/^sha256sums=('[0-9a-f]*'/sha256sums=('${digest#sha256:}'/" aur/PKGBUILD
          git diff --exit-code --quiet -- aur/PKGBUILD && { echo "::error::The PKGBUILD did not change."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit --quiet -am "chore(aur): update AstralParty.Toys to $VERSION"
          git push origin "$BRANCH"

  test:
    name: Build the package
    needs: update
    if: needs.update.outputs.version
    uses: ./.github/workflows/aur.yml
    with:
      ref: ${{ needs.update.outputs.branch }}

  report:
    name: Open a pull request or issue
    needs: [update, test]
    if: always() && needs.update.outputs.version
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.update.outputs.version }}
          BRANCH: ${{ needs.update.outputs.branch }}
          UPDATE: ${{ needs.update.result }}
          TEST: ${{ needs.test.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$UPDATE" = success ] && [ "$TEST" = success ]; then
            gh pr create --base main --head "$BRANCH" --title "Update AstralParty.Toys to $VERSION" \
              --body "打包上游 [v$VERSION](https://github.com/$UPSTREAM/releases/tag/v$VERSION)。软件包已在此分支构建并通过安装检查：$RUN。合并后会发布到 AUR。"
            exit 0
          fi
          title="打包上游 v$VERSION 失败"
          if [ "$UPDATE" != success ]; then
            reason="无法更新 aur/PKGBUILD，请查看运行记录。"
          else
            reason="已更新到 \`$BRANCH\`，但软件包构建或检查未通过。修复后从该分支提交 PR。"
          fi
          if [ "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)" = 0 ]; then
            gh issue create --title "$title" --body "$reason 运行记录：$RUN"
          fi

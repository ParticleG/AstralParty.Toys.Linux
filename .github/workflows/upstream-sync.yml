name: Upstream sync

# Merge each new upstream release into a branch, run Linux CI on it, then open a pull request.
# A merge conflict or failed check opens an issue instead; nothing is merged into main automatically.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync

env:
  UPSTREAM: higashitaniyume/AstralParty.Toys

jobs:
  merge:
    name: Merge the latest release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      branch: ${{ steps.release.outputs.branch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$tag"
          branch="sync/upstream-$tag"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "main already includes $tag."
          elif git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge and push
        if: steps.release.outputs.tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git merge --no-ff --no-edit -m "Merge upstream $TAG" FETCH_HEAD
          git push origin "$BRANCH"

  test:
    name: Linux CI
    needs: merge
    if: needs.merge.outputs.tag
    uses: ./.github/workflows/linux-ci.yml
    with:
      ref: ${{ needs.merge.outputs.branch }}

  report:
    name: Open a pull request or issue
    needs: [merge, test]
    if: always() && needs.merge.outputs.tag
    runs-on: ubuntu-24.04
    steps:
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.merge.outputs.tag }}
          BRANCH: ${{ needs.merge.outputs.branch }}
          MERGE: ${{ needs.merge.result }}
          TEST: ${{ needs.test.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$MERGE" = success ] && [ "$TEST" = success ]; then
            gh pr create --base main --head "$BRANCH" --title "Merge upstream $TAG" \
              --body "合并上游 [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG)。Linux CI 已在此分支通过：$RUN"
            exit 0
          fi
          title="同步上游 $TAG 失败"
          if [ "$MERGE" != success ]; then
            reason="合并有冲突。请在本地合并 \`$TAG\` 并解决冲突。"
          else
            reason="已合并到 \`$BRANCH\`，但 Linux CI 未通过。修复后从该分支提交 PR。"
          fi
          if [ "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)" = 0 ]; then
            gh issue create --title "$title" --body "$reason 运行记录：$RUN"
          fi

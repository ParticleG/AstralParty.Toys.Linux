name: AUR

# Build the AUR package in Arch Linux and test the installed result (linux/aur/build.sh), then
# push PKGBUILD and .SRCINFO to the AUR. Pushing a linux-v<version> tag publishes; a manual run
# publishes only when given a tag, and otherwise just builds the current commit.
# Publishing needs the AUR_SSH_PRIVATE_KEY secret, whose public key is on the maintainer's AUR account.
on:
  push:
    tags: ["linux-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as linux-v0.1.0 (leave empty to only build this commit)
        type: string
        default: ""
      pkgrel:
        description: AUR pkgrel (raise it to republish the same version)
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: aur

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PKGREL: ${{ inputs.pkgrel || '1' }}
  PKGNAME: astralparty-toys-linux

jobs:
  aur:
    name: Build and publish
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Git
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and test the package
        run: bash linux/aur/build.sh "$TAG" "$PKGREL"

      - name: Trust the AUR host keys
        run: |
          install -d -m 700 ~/.ssh
          # Host keys published on https://aur.archlinux.org/
          cat > ~/.ssh/aur_known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ssh-rsa 
          EOF
          # In a container job ssh finds ~ through the passwd entry rather than $HOME, so name the file.
          echo "AUR_SSH=ssh -o UserKnownHostsFile=$HOME/.ssh/aur_known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Check the AUR host key
        if: env.TAG == ''
        run: |
          # Without a key, the AUR must refuse authentication only after the host key was accepted.
          output=$($AUR_SSH -o BatchMode=yes aur@aur.archlinux.org 2>&1 || true)
          printf '%s\n' "$output"
          grep -q 'Permission denied (publickey)' <<< "$output"

      - name: Publish to the AUR
        if: env.TAG != ''
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::Set the AUR_SSH_PRIVATE_KEY secret before publishing."
            exit 1
          fi
          name=$(git log -1 --format=%an)
          email=$(git log -1 --format=%ae)
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          export GIT_SSH_COMMAND="$AUR_SSH -i $HOME/.ssh/aur"
          git clone "ssh://aur@aur.archlinux.org/$PKGNAME.git" "$RUNNER_TEMP/aur"
          cp /home/builder/aur/PKGBUILD /home/builder/aur/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has this PKGBUILD."
            exit 0
          fi
          version=$(sed -n 's/^pkgver=//p' PKGBUILD)
          git -c user.name="$name" -c user.email="$email" commit --quiet -m "Update to $version-$PKGREL"
          git push origin HEAD:master
